[package]
name = "portfolio-brief"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: summarize a Solana wallet (total USD value, top holdings with 24h change, per-token red/amber/green risk from mint/freeze authority, Token-2022 extensions and holder concentration)."
publish = false

[lib]
name = "portfolio_brief"
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
