name = "portfolio-brief"
version = "0.1.0"
description = "Summarize a Solana wallet: total USD value, top holdings with 24h change, and a red/amber/green risk flag per token (mint/freeze authority, Token-2022 extensions, holder concentration). Read-only."
author = "Albert"
wasm_path = "portfolio_brief.wasm"
capabilities = ["tool"]
# http_client: outbound reads to Solana RPC and the keyless Jupiter tokens API.
# config_read: optional rpc_url override, injected as __config; defaults to mainnet-beta.
permissions = ["http_client", "config_read"]
